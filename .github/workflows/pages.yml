name: Validate and deploy Research Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate domain contracts and source references
        run: node scripts/validate.mjs
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check markdown.js
      - name: Validate Python build script
        run: python -m py_compile scripts/build_site.py
      - name: Install Word conversion dependency
        run: python -m pip install --disable-pip-version-check python-docx==1.2.0
      - name: Build static website and downloadable documents
        run: python scripts/build_site.py
      - name: Verify bundled files and Word outputs
        run: |
          test -s dist/index.html
          test -s dist/catalog/domains/ai-short-drama.json
          test -s dist/downloads/ai-drama-bottlenecks-v1.docx
          test -s dist/downloads/ai-drama-solutions-v2.docx
      - name: Upload preview build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: research-pages-preview
          path: dist/

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate.mjs
      - run: python -m pip install --disable-pip-version-check python-docx==1.2.0
      - run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - name: Deploy site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
