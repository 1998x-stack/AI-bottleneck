name: Validate, version documents and deploy Research Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.pdf'
      - '**/*.docx'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate research data contract
        run: node scripts/validate.mjs
      - name: Check JavaScript and Python syntax
        run: |
          node --check app.js
          node --check markdown.js
          python -m py_compile scripts/build_site.py
      - name: Run render regression tests
        run: node scripts/test_render.mjs
      - name: Install DOCX and PDF rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer fonts-noto-cjk poppler-utils
          python -m pip install --disable-pip-version-check python-docx==1.2.0
      - name: Generate versioned Word/PDF in the repository and build Pages
        run: python scripts/build_site.py
      - name: Validate repository documents, PDFs and public downloads
        run: |
          python scripts/verify_exports.py
          test -s dist/index.html
          test -s dist/catalog/domains/ai-short-drama.json
          test -s dist/catalog/domains/ai-music.json
          test -s dist/downloads/ai-music-bottlenecks-v1.docx
          test -s dist/downloads/ai-music-bottlenecks-v1.pdf
          test -s dist/downloads/ai-music-solutions-v2.docx
          test -s dist/downloads/ai-music-solutions-v2.pdf
          test -s dist/downloads/ai-drama-bottlenecks-v1.docx
          test -s dist/downloads/ai-drama-bottlenecks-v1.pdf
          test -s dist/downloads/ai-drama-solutions-v2.docx
          test -s dist/downloads/ai-drama-solutions-v2.pdf
          pdfinfo dist/downloads/ai-drama-bottlenecks-v1.pdf | grep '^Pages:'
          pdfinfo dist/downloads/ai-drama-solutions-v2.pdf | grep '^Pages:'
      - name: Commit generated DOCX, PDF and source integrity manifest to Git
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- reports/
          if git diff --cached --quiet; then
            echo "No changes in versioned report documents."
          else
            git commit -m "docs: archive rendered Word and PDF reports [skip ci]"
            git push origin HEAD:main
          fi
      - name: Upload preview build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: research-pages-preview
          path: dist/
      - name: Upload production Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy versioned reports with downloadable Word and PDF
        id: deployment
        uses: actions/deploy-pages@v4
